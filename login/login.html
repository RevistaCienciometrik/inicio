<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cienciométrik - Iniciar Sesión</title>
    <!-- Agregamos FontAwesome para los iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    
    <!-- Botón de retorno al inicio en la esquina superior -->
    <a href="../index.html" class="back-home-btn">
        <i class="fas fa-arrow-left"></i> Volver al inicio
    </a>

    <div class="login-container">
        <div class="login-card">
            
            <div class="login-header">
                <!-- Intenta cargar el logo a color, si no, muestra el texto -->
                <img src="../logo.png" alt="Logo Cienciométrik" class="login-logo" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block';">
                <h2 id="logo-fallback" style="display: none; color: #003057; margin-bottom: 10px; font-family: 'Georgia', serif;">Cienciométrik</h2>
                
                <h1>Zona Administrativa</h1>
                <p>Ingresa tus credenciales para acceder al panel</p>
            </div>

            <form id="loginForm" class="modern-form">
                
                <div class="input-group">
                    <label for="email">Correo electrónico</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" placeholder="ejemplo@sena.edu.co" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
                    </div>
                </div>

                <div class="options-group">
                    <a href="#" class="forgot-password" id="forgotPasswordLink">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="login-button">
                    Iniciar sesión <i class="fas fa-sign-in-alt" style="margin-left: 8px;"></i>
                </button>
            </form>
            
        </div>
    </div>

    <script>
        // Script de recuperación de contraseña (Intacto)
        const forgotPasswordLink = document.getElementById('forgotPasswordLink');
        forgotPasswordLink.addEventListener('click', function(event) {
            event.preventDefault(); 
            const confirmarRedireccion = confirm("Serás redirigido a la página de recuperación de contraseña. ¿Deseas continuar?");
            if (confirmarRedireccion) {
                window.location.href = "pass_rec.html";
            }
        });
    </script>

    <!-- Script de autenticación original (Intacto) -->
    <script src="login.js"></script>
</body>
</html>
