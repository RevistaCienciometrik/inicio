<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cienciométrik - Recuperar Contraseña</title>
    <!-- FontAwesome para los iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Reutilizamos el mismo CSS elegante del login -->
    <link rel="stylesheet" href="login.css">
</head>
<body>
    
    <!-- Botón de retorno al inicio en la esquina superior -->
    <a href="../index.html" class="back-home-btn">
        <i class="fas fa-home"></i> Inicio
    </a>

    <div class="login-container">
        <!-- Reutilizamos la clase login-card para mantener la tarjeta blanca corporativa -->
        <div class="login-card" style="max-width: 480px;">
            
            <div class="login-header">
                <!-- Intentamos cargar el logo, si falla muestra texto -->
                <img src="../logo.png" alt="Logo Cienciométrik" class="login-logo" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block';">
                <h2 id="logo-fallback" style="display: none; color: #003057; margin-bottom: 10px; font-family: 'Georgia', serif;">Cienciométrik</h2>
                
                <h1>Recuperación de Acceso</h1>
                <p>Por favor, diligencia el siguiente formulario para procesar tu solicitud.</p>
            </div>

            <form id="recuperarPassForm" class="modern-form">
                
                <div class="input-group">
                    <label for="nombresApellidosRec">Nombres y Apellidos</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="nombresApellidosRec" placeholder="Ej: Carlos Pérez" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="cedulaRec">Documento de Identidad (Cédula)</label>
                    <div class="input-wrapper">
                        <i class="fas fa-id-card input-icon"></i>
                        <input type="text" id="cedulaRec" placeholder="Ingresa tu número de documento" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="fichaRec">Ficha SENA <span style="font-weight: normal; color: #888;">(Opcional)</span></label>
                    <div class="input-wrapper">
                        <i class="fas fa-hashtag input-icon"></i>
                        <input type="text" id="fichaRec" placeholder="Si eres aprendiz, ingresa tu ficha">
                    </div>
                </div>

                <div class="input-group">
                    <label for="emailRec">Correo electrónico institucional</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="emailRec" placeholder="ejemplo@sena.edu.co" required>
                    </div>
                </div>

                <button type="submit" class="login-button" style="margin-top: 20px;">
                    <i class="fas fa-paper-plane" style="margin-right: 8px;"></i> Enviar Solicitud
                </button>
            </form>

            <div class="options-group" style="text-align: center; margin-top: 25px; margin-bottom: 0;">
                <a href="login.html" class="forgot-password">
                    <i class="fas fa-arrow-left"></i> Volver al Login
                </a>
            </div>
            
        </div>
    </div>

    <script>
        document.getElementById('recuperarPassForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Evita que la página se recargue

            // Aquí a futuro conectaremos con Firebase para procesar la recuperación de forma real
            // const nombres = document.getElementById('nombresApellidosRec').value;
            // const email = document.getElementById('emailRec').value;
            
            // Reemplazamos el 'alert' feo de Windows por una notificación personalizada
            // Para mantenerlo sencillo ahora, usaremos alert pero puedes cambiarlo a un div dinámico luego
            alert("✅ ¡Solicitud Enviada!\n\nTu petición de recuperación ha sido recibida. Por favor, espera a que el Administrador valide tus datos. Recibirás las instrucciones en tu correo electrónico.");

            // Limpiamos el formulario
            this.reset();
            
            // Opcional: Devolver al usuario al login después de 2 segundos
            setTimeout(() => {
                window.location.href = "login.html";
            }, 2000);
        });
    </script>
</body>
</html>
